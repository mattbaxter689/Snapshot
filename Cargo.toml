[package]
name = "snapshot"
version = "0.1.0"
edition = "2024"

[dependencies]
datafusion = "55.3.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sqlparser = { version = "0.64.0", features = ["visitor"] }
